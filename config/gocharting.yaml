# GoCharting footprint capture — one saved chart URL; switch symbol via tick search.
chart_page_url: "https://gocharting.com/terminal/chart/OpJogbwTR"

# Wait after zoom / pan / refresh — applied immediately before PNG and CSV export.
chart_load_ms: 4000

login:
  avatar_button: "#login-avatar"
  email: "#email_field"
  password: "#password_field"
  submit: 'button[type="submit"]'

symbol_search:
  input_id: "input-search-ticks-input"
  results_id: "search-results"
  query_template: "EXNESS:{symbol}"
  type_delay_ms: 400
  settle_ms: 700

symbols:
  DXY:
    export_label: DXY
    detail_chart: false
    chart_page_url: "https://gocharting.com/terminal/chart/9mK0iRZGS"
  XAUUSD:
    export_label: GC
    # COMEX Gold Future on GoCharting (not spot EXNESS:XAUUSD).
    search_query: "GC1!"
    openai_label: "Gold Future (GC1!)"
    # First search hit only expands the GC list; click the contract row to load the chart.
    result_confirm_selector: 'b[title="GC1!"]'

interval_panel:
  button_selector: 'button:has(div:text-is("{interval}"))'
  settle_ms: 3000

screenshot:
  open_button: "#user-screenshot-btn"
  download_button: 'button:has(span div:text-is("Download")), button:has(span div:text-is("Tải xuống"))'
  popup_escape_presses: 1
  download_timeout_ms: 30000

csv_export:
  button_selector: 'button:has(svg path[d*="M439.658,91.21"])'
  download_timeout_ms: 30000

overview:
  refresh_button_id: "refresh-button"
  zoom_out_button_id: "zoomOut-button"
  zoom_out_clicks: 1
  zoom_click_delay_ms: 500

detail_chart:
  page_url: "https://gocharting.com/terminal/chart/orlk0N-Da"
  # CSS page zoom on the detail tab only (100 = no zoom).
  browser_zoom_percent: 100
  # Split each detail PNG into 3 horizontal panels for OpenAI (left / center / right).
  crop_width_thirds: false
  # Detail tab only — omit viewport_width to use 2× session viewport_width (1440 → 2880).
  viewport_width: 1920
  viewport_height: 1080
  refresh_button_id: "refresh-button"
  zoom_in_button_id: "zoomIn-button"
  zoom_clicks: 4
  zoom_click_delay_ms: 500
  chart_root_id: "chart-root-0"
  pan_start_x_ratio: 0.2
  pan_end_x_ratio: 0.9
  pan_y_ratio: 0.5
  pan_drag_steps: 12
  history_steps: 1
  # Per-interval overrides (merged on top of keys above).
  by_interval:
    15m:
      zoom_clicks: 4
      history_steps: 1
    5m:
      zoom_clicks: 4
      history_steps: 1

capture_plan:
  - symbol: DXY
    intervals: ["15m"]
  - symbol: XAUUSD
    intervals: ["15m", "5m"]

footprint_screenshot:
  output_subdir: footprint_images
  symbol: "COMEX:GC1!"
  # Tick Manager: cluster height = tick_size × block_multiplier (0.1 × 3 = 0.3).
  tick_size: 0.1
  block_multiplier: 2
  ocr_split_ratio: 0.5
  delete_screenshot_after_ocr: false
  refresh_before_capture: true
  clip: { x1: 50, y1: 60, x2: 290, y2: 1430 }
  intervals:
    15m:
      page_url: "https://gocharting.com/terminal/chart/S0kcqfQKt"
      viewport_width: 500
      viewport_height: 1500
      zoom_clicks: 10
    5m:
      page_url: "https://gocharting.com/terminal/chart/GC435uijM"
      viewport_width: 500
      viewport_height: 1500
      zoom_clicks: 10

footprint_ws:
  enabled: true
  # WS data is per-tick (0.1); aggregate to GoCharting chart row labels before OpenAI upload.
  # block_size = tick_size × block_multiplier (must match GoCharting Tick Manager Block setting).
  # Row label = anchor + ceil(block_multiplier/2)×tick (mult 2: 0.1–0.2→0.1; mult 4: 0.1–0.4→0.2).
  tick_size: 0.1
  block_multiplier: 4
  max_candles: 50
  extra_session_days: 1
  wait_ms: 45000
  export_format: combined
  mt5_spot: true
  gc_to_spot:
    enabled: true
    spot_tick: 0.01
    min_matched_ratio: 0.8
    skip_main_csv: true
    skip_main_png: true
  derived:
    enabled: false
    imbalance_enabled: false
    stacked_enabled: false
    absorption_enabled: false
    rl_min: 4.0
    stacked_min_levels: 3
    absorption_volume_pct: 0.25
    absorption_extreme_ticks: 2
    absorption_side_ratio: 1.5

clear_charts_before_capture: false
viewport_width: 1920
viewport_height: 1080
