syntax = "proto3";

// if you change the package name make sure to change
// it in the client retry config also
package fpgc;

option go_package = "gocharting/gocharting-server-golang/proto/fpgc;fpgc";

message Trade {
    string id = 1;
    int64 trade_time_ns = 2;
    int64 trade_time_ms = 3;
    int64 seq = 4;
    int64 ltp = 5;
    int64 size = 6;
    sint32 side = 7; // 1 = buy, -1 = sell
    string tick_direction = 8;
    string last_ex = 9;
    repeated string flags = 10;
    repeated string conditions = 11;
    BidAsk bid_ask = 12;
}

message BidAsk {
    int64 best_bid = 1;
    int64 best_bid_sz = 2;
    string best_bid_ex = 3;
    sint64 best_ask = 4;
    int64 best_ask_sz = 5;
    string best_ask_ex = 6;
}

message TradeList {
    Trade head = 1;
    repeated Trade tail = 2;
    int32 price_precision = 3;
    int32 size_precision = 4;
    string session = 5;
}

message FootPrintCandleList {
    repeated FootPrintCandle candles = 1;
    string session = 2;
}

message FootPrintForDateRequest {
    string exchange = 1;
    string segment = 2;
    string symbol = 3;
    string interval = 4;
    string session = 5;
    string date = 6;

}

message FootPrintForDateResponse {
    FootPrintForDateRequest request = 1;
    repeated FootPrintCandle candles = 2;
    FootPrintDay fp_day = 3;
    bool is_complete = 4;
    int32 version = 5;
}

message FootPrintDay {
    int32 tick_size = 1;
    int32 display_tick_size = 2;
    int32 volume_size_incr = 3;
    int32 price_precision = 4;
    int32 size_precision = 5;
}

message FootPrintCandle {
    string date = 1;
    EndingSummary ending_summary = 2;
    Levels totals = 3;
    Levels max = 4;
    Levels min = 5;
    repeated Footprint footprint = 6;
}

message Cluster {
	int64 trades = 1;
	int64 volume = 2;
}

message UniqueDataFeedForSymbol {
    string data_provider = 1;
    string exchange = 2;
    string segment = 3;
    string symbol = 4;
}

message Snapshot {
    string session_date = 1;

    optional int64 open = 2;
    optional int64 high = 3;
    optional int64 low = 4;
    optional int64 close = 5;
    int64 ltp = 6;
    int64 volume = 7;
    int64 volume_to = 8;

    int64 prev_close = 9;
    string prev_date = 10;

    string snapshot_type = 11;
    string session = 12;

    int64 prev_oi = 13;
    int64 oi = 14;
    map<string, int64> ltp_by_session = 15;
}

message SummaryForDate {
	string session_date = 1;
	// double tick_size = 2;
    UniqueDataFeedForSymbol key = 3;
	FootPrintCandle candle = 4;
    map<int64, Footprint> cluster_at_level = 5;
    FootPrintDay fp_day = 6;

    Snapshot snapshot = 7;
}

message Footprint {
	int64 level = 1;
	Cluster buy = 2;
	Cluster sell = 3;
}

message Levels {
	Cluster overall = 1;
	Cluster buy = 2;
	Cluster sell = 3;
}

message EndingSummary {
    int64 total_buy = 1;
    int64 total_sell = 2;

    int64 max_delta = 3;
    int64 min_delta = 4;
    int64 close_delta = 5;
    int64 open_delta = 6;

    int64 high = 7;
    int64 low = 8;

    int64 cot_high_buy = 9;
    int64 cot_high_sell = 10;
    int64 cot_low_buy = 11;
    int64 cot_low_sell = 12;

    int64 cot_high = 13;
    int64 cot_low = 14;
}
